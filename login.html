<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <br>
    <input type="password" id="loginPassword" placeholder="Password">
    <br>
    <button onclick="handleLogin()">Login</button>
    <p>No account? <a href="signup.html">Sign Up</a></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://wduseugfcrsildssotkg.supabase.co';  // REPLACE
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkdXNldWdmY3JzaWxkc3NvdGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTM4NzAsImV4cCI6MjA5MzI4OTg3MH0.mUwi74dZr6RD6vY5ISnBwr3nWDCIxdhS7Af11w7sbZM';  // REPLACE
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                // Check user's role
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();
                
                if (profile?.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
