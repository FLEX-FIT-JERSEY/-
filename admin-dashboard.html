    <p>Welcome, Admin!</p>
    <button onclick="logout()">Logout</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wduseugfcrsildssotkg.supabase.co';  // REPLACE
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkdXNldWdmY3JzaWxkc3NvdGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTM4NzAsImV4cCI6MjA5MzI4OTg3MH0.mUwi74dZr6RD6vY5ISnBwr3nWDCIxdhS7Af11w7sbZM';  // REPLACE
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        // Check if user is admin
        async function checkAdmin() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            const { data: profile } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();
            
            if (profile?.role !== 'admin') {
                alert('Admin access only');
                window.location.href = 'login.html';
            }
        }
        
        checkAdmin();
    </script>
</body>
